name: Refresh Context7 Docs

# Re-indexes this library on context7.com whenever the files it indexes
# change on main, so the snippets and rules agents receive never lag the
# README. Needs the CONTEXT7_API_KEY repo secret (Context7 dashboard).
on:
  push:
    branches: [main]
    paths:
      - README.md
      - context7.json
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Context7 refresh
        run: |
          # Library id is the lowercase URL path on context7.com, not
          # github.repository (which keeps the org's capitalisation).
          # Context7 refuses refreshes inside its minimum interval with a
          # 400 "too-early"; that is not a failure of this workflow, the
          # next eligible push will pick the change up.
          body=$(curl -s -w '\n%{http_code}' -X POST https://context7.com/api/v1/refresh \
            -H "Authorization: Bearer ${{ secrets.CONTEXT7_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"libraryName": "/checkthatphone/checkthatphone-python"}')
          code=$(echo "$body" | tail -1); msg=$(echo "$body" | sed '$d')
          echo "HTTP $code: $msg"
          case "$code" in
            200) exit 0 ;;
            400) echo "$msg" | grep -q too-early && exit 0 || exit 1 ;;
            *) exit 1 ;;
          esac
